en:
  form:
    attributes:
      name:
        name: "Name"
      search:
        name: "Search"
      email:
        name: "Email"
      password:
        name: "Password"
    CreateUser:
      attributes:
        confirmEmail:
          name: "Confirm Email"
        confirmPassword:
          name: "Confirm Password"
    Item:
      attributes:
        description:
          name: "Description"
        defaultUnit:
          name: "Default Unit"
    Search:
      attributes:
        search:
          name: "Search"
  enum:
    Unit:
      Gram:
        name: "Grams (g)"
      Kilogram:
        name: "Kilograms (kg)"
      Ounce:
        name: "Ounces (oz)"
      Pound:
        name: "Pounds (lb)"
      Milliliter:
        name: "Milliliters (ml)"
      Liter:
        name: "Liters (l)"
      Hectoliter:
        name: "Hectoliters (hl)"
      FluidOunce:
        name: "Fluid Ounces (fl oz)"
      Gallon:
        name: "Gallons (gal)"
      UsBeerBarrel:
        name: "US Beer Barrels (bbl)"
      Each:
        name: "Each"
      Minute:
        name: "Minutes"
      Hour:
        name: "Hours"
  password_policy:
    min_length: "{pluralize($count) { one { At least $count character long } default { At least $count characters long } }}"
    max_length: "{pluralize($count) { one { At most $count character long } default { At most $count characters long } }}"
    uppercase: "{pluralize($count) { one { At least $count uppercase letter } default { At least $count uppercase letters } }}"
    lowercase: "{pluralize($count) { one { At least $count lowercase letter } default { At least $count lowercase letters } }}"
    digits: "{pluralize($count) { one { At least $count digit } default { At least $count digits } }}"
    special: "{pluralize($count) { one { At least $count special character } default { At least $count special characters } }}"
