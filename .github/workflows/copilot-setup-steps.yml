name: Copilot Agent Setup Steps

# This workflow defines the setup steps for GitHub Copilot agents
# It mirrors the CI workflow but is designed for agent environment setup
# This workflow is not meant to be run automatically, but rather used as
# a reference for setting up the development environment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    name: Setup Haskell Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create databases
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE optimize_beer_development;"
        PGPASSWORD=password psql -h localhost -U postgres -c "CREATE DATABASE optimize_beer_test;"
    - name: Load schema
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -d optimize_beer_development < optimize-beer/db/schema.sql
        PGPASSWORD=password psql -h localhost -U postgres -d optimize_beer_test < optimize-beer/db/schema.sql

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: '9.8.2'
        cabal-version: '3.10'

    - name: Update cabal package list
      run: cabal update

    - name: Configure project
      run: cabal configure --enable-tests

    - name: Dry run to generate plan.json
      run: cabal build all --dry-run

    - name: Restore cached dependencies
      uses: actions/cache/restore@v4
      id: restore-deps-cache
      env:
        cache-name: cache-cabal-copilot
      with:
        path: |
          ~/.cabal/store
        key: ${{ runner.os }}-build-${{ env.cache-name }}-9.8.2-${{ hashFiles('**/plan.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-9.8.2-
          ${{ runner.os }}-build-${{ env.cache-name }}-

    - name: Install dependencies
      run: |
        cabal build --only-dependencies --enable-tests --enable-benchmarks all

    - name: Save dependencies cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cabal/store
        key: ${{ steps.restore-deps-cache.outputs.cache-primary-key }}
    - name: Restore cached ofiles
      uses: actions/cache/restore@v4
      id: restore-bins-cache
      env:
        cache-name: cache-cabal-copilot-ofiles
      with:
        path: |
          dist-newstyle/
        key: ${{ runner.os }}-build-${{ env.cache-name }}-9.8.2-${{ hashFiles('**/plan.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-9.8.2-

    - name: Build all packages
      run: cabal build --enable-tests --enable-benchmarks all

    - name: Apply migrations
      run: |
        export DATABASE_URL=postgresql://postgres:password@localhost:5432/optimize_beer_development
        cabal run noided-migrate -- migrate --dir optimize-beer/db/migrations
        export DATABASE_URL=postgresql://postgres:password@localhost:5432/optimize_beer_test
        cabal run noided-migrate -- migrate --dir optimize-beer/db/migrations

    - name: Save ofiles cache
      uses: actions/cache/save@v4
      with:
        path: |
          dist-newstyle/
        key: ${{ steps.restore-bins-cache.outputs.cache-primary-key }}

    - name: Run tests
      run: cabal test all
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/optimize_beer_test

    - name: Setup complete
      run: |
        echo "============================================"
        echo "Setup completed successfully!"
        echo "============================================"
        echo ""
        echo "Environment details:"
        echo "  GHC: $(ghc --version)"
        echo "  Cabal: $(cabal --version)"
        echo ""
        echo "Available packages:"
        echo "  - noided-form"
        echo "  - noided-pathname"
        echo "  - noided-row"
        echo "  - noided-translate"
        echo "  - noided-validation"
        echo "  - noided-sql-migrations (noided-migrate)"
        echo "  - optimize-beer"
        echo ""
        echo "Common commands:"
        echo "  cabal build all          - Build all packages"
        echo "  cabal test all           - Run all tests"
        echo "  cabal build <package>    - Build a specific package"
        echo "  cabal test <package>     - Test a specific package"
        echo "  cabal run noided-migrate -- migrate - Run migrations"
