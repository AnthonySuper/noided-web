name: Copilot Agent Setup Steps

# This workflow defines the setup steps for GitHub Copilot agents
# It mirrors the CI workflow but is designed for agent environment setup
# This workflow is not meant to be run automatically, but rather used as
# a reference for setting up the development environment

on:
  workflow_dispatch:
    inputs:
      ghc-version:
        description: 'GHC version to use'
        required: false
        default: '9.8.2'
        type: choice
        options:
          - '9.6.7'
          - '9.8.2'
      cabal-version:
        description: 'Cabal version to use'
        required: false
        default: '3.10'
        type: string

jobs:
  setup:
    name: Setup Haskell Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ inputs.ghc-version || '9.8.2' }}
        cabal-version: ${{ inputs.cabal-version || '3.10' }}
    
    - name: Update cabal package list
      run: cabal update
    
    - name: Configure project
      run: cabal configure --enable-tests
    
    - name: Dry run to generate plan.json
      run: cabal build all --dry-run
    
    - name: Restore cached dependencies
      uses: actions/cache/restore@v4
      id: restore-deps-cache
      env:
        cache-name: cache-cabal
      with:
        path: |
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ inputs.ghc-version || '9.8.2' }}-${{ hashFiles('**/plan.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-${{ inputs.ghc-version || '9.8.2' }}-
          ${{ runner.os }}-build-${{ env.cache-name }}-
    
    - name: Install dependencies
      run: |
        cabal build --only-dependencies --enable-tests --enable-benchmarks all
    
    - name: Save dependencies cache
      uses: actions/cache/save@v4
      if: steps.restore-deps-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.restore-deps-cache.outputs.cache-primary-key }}
    
    - name: Build all packages
      run: cabal build --enable-tests --enable-benchmarks all

    - name: Run tests
      run: cabal test all
    
    - name: Setup complete
      run: |
        echo "============================================"
        echo "Setup completed successfully!"
        echo "============================================"
        echo ""
        echo "Environment details:"
        echo "  GHC: $(ghc --version)"
        echo "  Cabal: $(cabal --version)"
        echo ""
        echo "Available packages:"
        echo "  - noided-form"
        echo "  - noided-pathname"
        echo "  - noided-row"
        echo "  - noided-translate"
        echo "  - noided-validation"
        echo ""
        echo "Common commands:"
        echo "  cabal build all          - Build all packages"
        echo "  cabal test all           - Run all tests"
        echo "  cabal build <package>    - Build a specific package"
        echo "  cabal test <package>     - Test a specific package"
